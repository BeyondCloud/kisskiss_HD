name: Update gallery

on:
  push:
    branches: [main]
    paths:
      - 'PNG/**'
      - 'GIF/**'
      - 'scripts/gen_gallery.py'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate galleries
        run: python scripts/gen_gallery.py
      - name: Commit changes
        run: |
          if git diff --quiet -- PNG/README.md GIF/README.md; then
            echo "No gallery changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PNG/README.md GIF/README.md
          git commit -m "Auto-update image gallery"
          git push
